[project]
name = "zd"
version = "0.1.0"
description = "Ad-free plain HTML mirror of latest zdopravy.cz articles"
authors = [
    { name = "Honza Javorek", email = "mail@honzajavorek.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
zd = "zd:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
